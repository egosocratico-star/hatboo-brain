[package]
name = "hatboo-brain"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "El cerebro que administra el trabajo alrededor de un modelo: decide barato, firma un Plan, recorta contexto y tools, verifica y se recupera por clase de fallo."
license = "MIT"
repository = "https://github.com/egosocratico-star/hatboo-brain"
readme = "README.md"
keywords = ["llm", "agent", "routing", "ollama"]
categories = ["api-bindings", "asynchronous"]

# Las mismas siete dependencias que ya compila Hatboo desktop, más `sha2`: el
# hash de confianza de `HATBOO.md` **sí** se usa para decidir si un contenido
# entra al prompt, así que ya no puede ser FNV (§8 del plan). El resto de hashes
# del crate (`plan_hash`, `parent_plan_hash`, la firma de la caché) siguen siendo
# identificadores de linaje y se calculan con el FNV-1a-64 de
# `observability::hash`.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"
futures-util = "0.3"
thiserror = "2"
sha2 = "0.10"

[features]
# Solo Ollama por defecto: es el backend que el Canon exige en la Fase 1 y el
# único que corre en la máquina de referencia. Las tres puertas de API se encienden
# explícitamente (`--features openai`), así que un consumidor local no arrastra
# código de red que no va a usar ni paga su superficie en el binario.
default = ["ollama"]
ollama = []
openai = []
anthropic = []
# Puerta genérica OpenAI-compatible para cualquier base URL (HF, vLLM, LM Studio).
generic = []

[[bin]]
name = "brain-bench"
path = "src/bin/brain-bench.rs"

[profile.dev]
# Su portátil tiene 8,45 GB: compilar los tests con dep-debug de más es lo que
# llena el disco y arrastra el `cargo test`.
debug = 0
